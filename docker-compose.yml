services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /stl/api
    image: electroplating-app:latest
    container_name: plateforge
    ports:
      - "8116:8116"
      - "3017:8116"
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/tmp/api.log
      - ALLOWED_ORIGINS=http://localhost:3017,http://localhost:8116,http://localhost:3000,https://mlapi.us
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8116/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
