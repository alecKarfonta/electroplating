version: '3.8'

services:
  app:
    build: .
    image: electroplating-app:local
    container_name: plateforge-app
    ports:
      - "8116:8116"
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/tmp/api.log
      - ALLOWED_ORIGINS=http://localhost:8116,http://localhost:3017,https://mlapi.us
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8116/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stl-network

  backend:
    build: .
    container_name: stl-analysis-api
    ports:
      - "8116:8116"
    volumes:
      # Mount sessions directory for persistent file storage
      - ./sessions:/app/sessions
      # Mount logs directory (optional)
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/tmp/api.log
      - ALLOWED_ORIGINS=http://localhost:3017,http://localhost:3000,http://192.168.1.196:3017,https://mlapi.us
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8116/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stl-network
    profiles:
      - split

  frontend:
    build: ./frontend
    container_name: stl-analysis-frontend
    ports:
      - "3017:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stl-network
    environment:
      - REACT_APP_API_URL=/stl/api
    profiles:
      - split

  # Optional: Add a reverse proxy with nginx for production
  nginx:
    image: nginx:alpine
    container_name: stl-api-nginx
    ports:
      - "8085:80"
      - "44385:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - stl-network
    profiles:
      - production

networks:
  stl-network:
    driver: bridge

volumes:
  sessions:
    driver: local
  logs:
    driver: local 