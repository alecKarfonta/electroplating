apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: electroplating
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: electroplating
    spec:
      containers:
        - name: backend
          image: ghcr.io/aleckarfonta/electroplating/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8116
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: sessions
              mountPath: /app/sessions
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: backend-sessions
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: electroplating
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8116
      targetPort: http
