apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: electroplating
data:
  PYTHONPATH: "/app"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
  LOG_FILE: "/app/logs/api.log"
  ALLOWED_ORIGINS: "https://mlapi.us,http://localhost:3017"
