apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plateforge-app
  labels:
    app.kubernetes.io/name: plateforge
    app.kubernetes.io/part-of: plateforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: mlapi.us
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8116
          - path: /plateforge
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8116
          - path: /stl/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8116
