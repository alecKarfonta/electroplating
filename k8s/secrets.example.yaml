# Copy and customize before applying. Do not commit real credentials.
#
# GHCR image pull secret (required if packages are private):
#   kubectl create secret docker-registry ghcr-credentials \
#     --namespace electroplating \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USERNAME \
#     --docker-password=YOUR_GITHUB_TOKEN
#
# TLS certificate for ingress (or use cert-manager):
#   kubectl create secret tls electroplating-tls \
#     --namespace electroplating \
#     --cert=path/to/cert.pem \
#     --key=path/to/key.pem
