services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/electroplating}/backend:latest
    container_name: plateforge
    ports:
      - "8116:8116"
      - "3017:8116"
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/api.log
      - MAX_FILE_SIZE=104857600
      - SESSION_TIMEOUT=3600
      - MAX_SESSIONS=1000
      - ALLOWED_ORIGINS=https://mlapi.us
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8116/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
