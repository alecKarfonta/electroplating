name: plateforge
namespace: plateforge

build:
  compose_file: docker-compose.yml
  service: app
  homelab:
    image: docker.io/library/electroplating-app:local
    delivery: import
    registry:
      repo: plateforge/plateforge
      tag: local
  registry:
    image: ghcr.io/aleckarfonta/electroplating/plateforge
    tag: latest
    push: true

k8s:
  deployment: backend
  default_overlay: homelab
  overlays:
    homelab:
      import_nodes: homelab/cpu-tier=cheap
    production: {}

storage:
  sessions:
    type: emptyDir
    size: 10Gi

verify:
  - url: https://mlapi.us/plateforge/
    description: PlateForge UI
    expect_status: 200
  - url: https://mlapi.us/stl/api/health
    description: PlateForge API health
    expect_status: 200

nginx:
  name: plateforge
  host: auto
  service: backend
  service_port: api
  upstreams:
    host196_plateforge_api: 8116
    host196_plateforge_fe: 8116
