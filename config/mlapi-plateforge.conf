# Canonical copy: ~/git/system/nginx/apps/plateforge.conf
# Install with: sudo ~/git/system/scripts/install-nginx-app.sh plateforge
# Or from this repo: sudo ./scripts/fix-mlapi-plateforge-nginx.sh

location /stl/api/ {
    proxy_pass http://host196_plateforge_api/;
    include /etc/nginx/snippets/proxy-backend.conf;
    include /etc/nginx/snippets/proxy-timeout.conf;
}

location /plateforge/ {
    proxy_pass http://host196_plateforge_api;
    include /etc/nginx/snippets/proxy-backend.conf;
    include /etc/nginx/snippets/proxy-timeout.conf;
}

location = /plateforge {
    return 301 /plateforge/;
}

location /stl-api/ {
    proxy_pass http://host196_plateforge_api/;
    include /etc/nginx/snippets/proxy-backend.conf;
    include /etc/nginx/snippets/proxy-timeout.conf;
}
